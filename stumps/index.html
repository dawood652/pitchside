<html lang="en">
<head>
<meta charset="utf-8" />

<style>

<div id="world"></div>
<div id="app"></div>
<div id="hud"></div>
<div id="ui" hidden></div>
<div id="boot"><div class="logo"><span class="logo-s">STUMPS</span><span class="logo-tag">loading the ground…</span></div></div>
