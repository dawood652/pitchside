<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cover Drive Test</title>
<style>
  :root { --bg: #0e1a12; --ink: #f2f4ef; --muted: #9fb3a5; --chip: #1c2f22; --chip-on: #3fbf74; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, sans-serif; }
  body { display: flex; flex-direction: column; }
  canvas { flex: 1; width: 100%; min-height: 0; display: block; touch-action: none; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px 14px; }
  .bar h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 650; }
  button { background: var(--chip); color: var(--ink); border: 0; border-radius: 999px; padding: 8px 14px; font: inherit; cursor: pointer; }
  button.on { background: var(--chip-on); color: #062010; font-weight: 650; }
  input[type=range] { flex: 1; min-width: 160px; accent-color: var(--chip-on); }
  .hint { color: var(--muted); font-size: 13px; width: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar">
  <h1>Cover drive · 2D test</h1>
  <button id="play" class="on">Pause</button>
  <button data-s="1" class="on">1×</button>
  <button data-s="0.5">½×</button>
  <button data-s="0.2">Slow</button>
  <button id="ghost">Key poses</button>
  <input id="scrub" type="range" min="0" max="1000" value="0" />
  <div class="hint">Space = pause · drag the slider to scrub frame by frame</div>
</div>
<script>
// 2D cover drive: hand-keyed poses (side-on view from point), smooth monotone interpolation,
// two-bone IK for arms and legs so hands stay on the bat and feet stay planted.
(function (G) {
  const L = { thigh: 0.44, shin: 0.42, upper: 0.29, fore: 0.33, spine: 0.5, ankle: 0.08 };
  const CH = ['px', 'py', 'lean', 'sw', 'fx', 'fy', 'bx', 'by', 'gx', 'gy', 'bat', 'head'];
  // t (s, contact = 0) then the channels above
  const STANCE = [0.08, 0.84, 22, 0.13, 0.30, 0, -0.14, 0, 0.12, 0.9, 16, 0];
  const KEYS = [
    [-1.1, ...STANCE],
    [-0.75, ...STANCE],
    [-0.55, 0.11, 0.83, 22, 0.13, 0.33, 0, -0.06, 0, 0.1, 0.96, 30, 0], // trigger
    [-0.33, 0.24, 0.84, 17, 0.14, 0.58, 0.12, -0.06, 0, 0.02, 1.12, 125, 0], // backlift, front foot up
    [-0.17, 0.4, 0.79, 22, 0.13, 0.86, 0, -0.05, 0, 0.1, 1.2, 150, 4], // front foot lands
    [-0.07, 0.46, 0.76, 27, 0.11, 0.86, 0, -0.04, 0.02, 0.42, 1.0, 70, 8], // downswing
    [0, 0.48, 0.75, 30, 0.1, 0.86, 0, -0.02, 0.05, 0.66, 0.8, 6, 10], // contact
    [0.07, 0.49, 0.76, 28, 0.06, 0.86, 0, -0.01, 0.06, 0.95, 0.88, -70, 8],
    [0.13, 0.49, 0.77, 25, 0.0, 0.86, 0, -0.01, 0.06, 1.1, 1.08, -105, 6], // extension toward the target
    [0.22, 0.48, 0.78, 20, 0.03, 0.86, 0, 0.0, 0.06, 0.95, 1.5, -150, 4],
    [0.42, 0.46, 0.79, 16, 0.04, 0.86, 0, 0.0, 0.06, 0.9, 1.42, -200, 2], // high finish, bat over the front shoulder
    [0.95, 0.46, 0.79, 16, 0.04, 0.86, 0, 0.0, 0.06, 0.9, 1.42, -200, 2],
  ];
  const T0 = KEYS[0][0], T1 = KEYS[KEYS.length - 1][0];
  // monotone cubic (no overshoot, holds stay still)
  const ts = KEYS.map((k) => k[0]);
  const tans = CH.map((_, c) => {
    const y = KEYS.map((k) => k[c + 1]);
    const n = y.length, d = [], m = new Array(n).fill(0);
    for (let i = 0; i < n - 1; i++) d.push((y[i + 1] - y[i]) / (ts[i + 1] - ts[i]));
    m[0] = d[0]; m[n - 1] = d[n - 2];
    for (let i = 1; i < n - 1; i++) {
      if (d[i - 1] * d[i] <= 0) { m[i] = 0; continue; }
      m[i] = (d[i - 1] + d[i]) / 2;
      const a = m[i] / d[i - 1], b = m[i] / d[i], s = a * a + b * b;
      if (s > 9) m[i] *= 3 / Math.sqrt(s);
    }
    for (let i = 0; i < n - 1; i++) if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; }
    return { y, m };
  });
  function chan(t) {
    t = Math.min(T1, Math.max(T0, t));
    let i = 0; while (i < ts.length - 2 && t > ts[i + 1]) i++;
    const h = ts[i + 1] - ts[i], u = (t - ts[i]) / h, u2 = u * u, u3 = u2 * u;
    const o = {};
    CH.forEach((name, c) => {
      const { y, m } = tans[c];
      o[name] = (2 * u3 - 3 * u2 + 1) * y[i] + (u3 - 2 * u2 + u) * h * m[i] + (-2 * u3 + 3 * u2) * y[i + 1] + (u3 - u2) * h * m[i + 1];
    });
    return o;
  }
  const add = (a, b) => ({ x: a.x + b.x, y: a.y + b.y }), sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
  const mul = (a, k) => ({ x: a.x * k, y: a.y * k }), len = (a) => Math.hypot(a.x, a.y);
  function ik(a, target, l1, l2, pole, depth = 1) {
    const raw = len(sub(target, a));
    const d = Math.min(l1 + l2 - 1e-4, Math.max(Math.abs(l1 - l2) + 1e-3, raw));
    const dir = mul(sub(target, a), 1 / (raw || 1));
    const along = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, l1 * l1 - along * along));
    let p = { x: -dir.y, y: dir.x };
    if (p.x * pole.x + p.y * pole.y < 0) p = mul(p, -1);
    return { mid: add(add(a, mul(dir, along)), mul(p, h * depth)), end: add(a, mul(dir, d)), reach: raw / (l1 + l2) };
  }
  function pose(t) {
    const c = chan(t);
    const r = (c.lean * Math.PI) / 180;
    const up = { x: Math.sin(r), y: Math.cos(r) }, across = { x: Math.cos(r), y: -Math.sin(r) };
    const pel = { x: c.px, y: c.py };
    const neck = add(pel, mul(up, L.spine));
    const shL = add(neck, mul(across, c.sw)), shR = sub(neck, mul(across, c.sw));
    const hipL = add(pel, { x: 0.09, y: 0 }), hipR = add(pel, { x: -0.09, y: 0 });
    const legF = ik(hipL, { x: c.fx, y: L.ankle + c.fy }, L.thigh, L.shin, { x: 1, y: 0.2 });
    const legB = ik(hipR, { x: c.bx, y: L.ankle + c.by }, L.thigh, L.shin, { x: 1, y: 0.2 });
    const th = (c.bat * Math.PI) / 180;
    const bd = { x: -Math.sin(th), y: -Math.cos(th) }; // handle -> toe
    const gT = { x: c.gx, y: c.gy }, gB = add(gT, mul(bd, 0.11)), H = sub(gT, mul(bd, 0.06));
    const armF = ik(shL, gT, L.upper, L.fore, { x: 1, y: 0.3 }, 0.45); // seen from point, most of the elbow bend is toward the camera
    const armB = ik(shR, gB, L.upper, L.fore, { x: -0.5, y: -1 }, 0.45);
    const hr = ((c.lean + c.head) * Math.PI) / 180;
    const head = add(neck, { x: Math.sin(hr) * 0.15 + 0.02, y: Math.cos(hr) * 0.15 });
    return { t, c, pel, neck, shL, shR, hipL, hipR, legF, legB, armF, armB, H, bd, gT, gB, head, toe: add(H, mul(bd, 0.86)), sweet: add(H, mul(bd, 0.64)) };
  }
  const CONTACT = pose(0).sweet;
  function ball(t) {
    const R = { x: 17, y: 2.1 }, B = { x: CONTACT.x + 1.7, y: 0.036 };
    if (t < -0.72) return null;
    if (t < -0.09) { const s = (t + 0.72) / 0.63; return { x: R.x + (B.x - R.x) * s, y: R.y + (B.y - R.y) * Math.pow(s, 1.25) }; }
    if (t < 0) { const s = (t + 0.09) / 0.09; return { x: B.x + (CONTACT.x - B.x) * s, y: B.y + (CONTACT.y - B.y) * s }; }
    const u = t; return { x: CONTACT.x + 15 * u, y: Math.max(0.036, CONTACT.y + 2.2 * u - 4.9 * u * u) };
  }
  G.Anim = { pose, ball, T0, T1, L, KEYS };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
const A = window.Anim;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, S = 1, OX = 0, OY = 0;
function resize() {
  const r = cv.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1);
  cv.width = r.width * d; cv.height = r.height * d; W = cv.width; H = cv.height;
  S = Math.min(H / 2.6, W / 4.2); // pixels per metre
  OX = W * 0.36 - 0.3 * S; OY = H * 0.88;
}
addEventListener('resize', resize); resize();
const X = (p) => OX + p.x * S, Y = (p) => OY - p.y * S;

const C = { shirt: '#1f9a55', trou: '#1b8048', skin: '#dcaa82', pad: '#f7f5ee', padD: '#d6d1c3', helm: '#0e5c34', grille: '#a9b0b6',
  glove: '#fbfbf8', gloveD: '#dcdad2', trim: '#1f9a55', line: '#14201a', shoe: '#f4f4f2', sole: '#2a2d30', bat: '#ecd29a', batD: '#c8a467', grip: '#20232a' };
const OUT = 0.006; // outline (m)
const lerp = (a, b, k) => ({ x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k });
const add = (a, b) => ({ x: a.x + b.x, y: a.y + b.y }), mul = (a, k) => ({ x: a.x * k, y: a.y * k });
const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y }), nrm = (a) => { const l = Math.hypot(a.x, a.y) || 1; return { x: a.x / l, y: a.y / l }; };
function tone(hex, k) { // k > 0 lighter, k < 0 darker
  let c0;
  if (hex[0] === '#') { const n = parseInt(hex.slice(1), 16); c0 = [n >> 16, (n >> 8) & 255, n & 255]; } else c0 = hex.match(/\d+/g).map(Number);
  const c = c0.map((v) => Math.round(k > 0 ? v + (255 - v) * k : v * (1 + k)));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
/** Shading across a part: lit from the upper left, soft core shadow on the far side. */
function shadeAcross(a, b, w, base) {
  const d = nrm(sub(b, a)), n = { x: -d.y, y: d.x }, m = lerp(a, b, 0.5);
  const lit = n.x * -0.6 + n.y * 0.8 > 0 ? 1 : -1;
  const p1 = add(m, mul(n, w * lit)), p2 = add(m, mul(n, -w * lit));
  const g = ctx.createLinearGradient(X(p1), Y(p1), X(p2), Y(p2));
  g.addColorStop(0, tone(base, 0.16)); g.addColorStop(0.4, base); g.addColorStop(1, tone(base, -0.18));
  return g;
}
function taper(a, b, ra, rb, base, outline = true) {
  const ax = X(a), ay = Y(a), bx = X(b), by = Y(b), f = Math.atan2(by - ay, bx - ax);
  ctx.beginPath(); ctx.arc(ax, ay, ra * S, f + Math.PI / 2, f + Math.PI * 1.5); ctx.arc(bx, by, rb * S, f - Math.PI / 2, f + Math.PI / 2); ctx.closePath();
  ctx.fillStyle = shadeAcross(a, b, Math.max(ra, rb), base); ctx.fill();
  if (outline) { ctx.lineWidth = OUT * S; ctx.strokeStyle = C.line; ctx.lineJoin = 'round'; ctx.stroke(); }
}
function poly(pts, fill, outline = true) {
  ctx.beginPath(); pts.forEach((q, i) => (i ? ctx.lineTo(X(q), Y(q)) : ctx.moveTo(X(q), Y(q)))); ctx.closePath();
  ctx.fillStyle = fill; ctx.fill(); if (outline) { ctx.lineJoin = 'round'; ctx.lineWidth = OUT * S; ctx.strokeStyle = C.line; ctx.stroke(); }
}
function stroke(a, b, w, col) { ctx.lineCap = 'round'; ctx.lineWidth = w * S; ctx.strokeStyle = col; ctx.beginPath(); ctx.moveTo(X(a), Y(a)); ctx.lineTo(X(b), Y(b)); ctx.stroke(); }
function ell(p, rx, ry, rot, fill, outline = true) {
  ctx.beginPath(); ctx.ellipse(X(p), Y(p), rx * S, ry * S, -rot, 0, 7); ctx.fillStyle = fill; ctx.fill();
  if (outline) { ctx.lineWidth = OUT * S; ctx.strokeStyle = C.line; ctx.stroke(); }
}

function leg(L, hip, front) {
  const knee = L.mid, ank = L.end, dk = front ? 0 : -0.1;
  taper(hip, knee, 0.078, 0.058, tone(C.trou, dk));
  // pad: cane shin guard from above the knee to the ankle, ridges, two straps, knee roll
  const top = lerp(knee, hip, 0.22), bot = add(ank, { x: 0, y: -0.01 });
  taper(top, bot, 0.072, 0.062, tone(C.pad, dk));
  const d = nrm(sub(bot, top)), n = { x: -d.y, y: d.x };
  for (const o of [-0.03, 0, 0.03]) stroke(add(lerp(top, bot, 0.08), mul(n, o)), add(lerp(top, bot, 0.93), mul(n, o * 0.85)), 0.006, tone(C.padD, dk));
  for (const k of [0.32, 0.72]) { const c = lerp(top, bot, k); stroke(add(c, mul(n, -0.07)), add(c, mul(n, 0.07)), 0.014, '#1f2a24'); }
  ell(lerp(top, knee, 0.45), 0.078, 0.062, Math.atan2(d.y, d.x), tone(C.pad, dk - 0.02));
  // spiked cricket shoe
  const fwd = front ? 1 : 0.6, toe = { x: ank.x + 0.17 * fwd, y: Math.max(0.03, ank.y - 0.06) }, heel = { x: ank.x - 0.05, y: Math.max(0.03, ank.y - 0.05) };
  taper(heel, toe, 0.042, 0.032, tone(C.shoe, dk - 0.04));
  stroke(add(heel, { x: 0, y: -0.035 }), add(toe, { x: 0.005, y: -0.027 }), 0.016, C.sole);
}
/** wrist: where the forearm ends and the glove cuff begins */
function wristOf(Ar) { return lerp(Ar.mid, Ar.end, 0.74); }
function armUpper(Ar, sh, back) {
  const dk = back ? -0.12 : 0, el = Ar.mid, wr = wristOf(Ar);
  taper(el, wr, 0.043, 0.034, tone(C.skin, dk)); // forearm
  taper(sh, el, 0.058, 0.046, tone(C.skin, dk)); // upper arm
  taper(sh, lerp(sh, el, 0.55), 0.072, 0.056, tone(C.shirt, dk)); // short sleeve
}
/** Batting glove clenched round the handle: padded back, four finger rolls crossing the handle,
 *  thumb along the top, cuff with a coloured band running back to the wrist. */
function glove(grip, bd, wrist) {
  const u = bd, v = { x: -bd.y, y: bd.x };
  const ws = Math.sign((wrist.x - grip.x) * v.x + (wrist.y - grip.y) * v.y) || 1; // wrist side
  const at = (a, b) => add(grip, add(mul(u, a), mul(v, b * ws)));
  // cuff from the wrist into the glove
  taper(wrist, at(0, 0.04), 0.044, 0.05, C.glove);
  stroke(lerp(wrist, at(0, 0.04), 0.35), lerp(wrist, at(0, 0.04), 0.35), 0, C.trim);
  { const c = lerp(wrist, at(0, 0.04), 0.3), d = nrm(sub(at(0, 0.04), wrist)), n = { x: -d.y, y: d.x }; stroke(add(c, mul(n, -0.045)), add(c, mul(n, 0.045)), 0.018, C.trim); }
  // padded back of the hand
  poly([at(-0.055, 0.055), at(0.055, 0.055), at(0.06, -0.01), at(-0.06, -0.01)], C.glove);
  // finger rolls wrap over the handle (the far side of the grip from the wrist)
  for (let i = 0; i < 4; i++) {
    const k = -0.039 + i * 0.026;
    taper(at(k, 0.012), at(k, -0.05), 0.0135, 0.0128, i % 2 ? C.gloveD : C.glove);
  }
  // thumb laid along the handle
  taper(at(-0.05, 0.03), at(-0.012, -0.02), 0.015, 0.013, C.glove);
}
function bat(p) {
  const h = p.H, d = p.bd, n = { x: -d.y, y: d.x };
  const at = (k, w) => add(h, add(mul(d, k), mul(n, w)));
  // handle with rubber grip rings
  taper(at(0, 0), at(0.3, 0), 0.019, 0.017, C.grip);
  for (let k = 0.03; k < 0.28; k += 0.035) stroke(at(k, -0.018), at(k, 0.018), 0.004, '#3a3f48');
  // blade: shoulders, edges, toe; grain shading and a sticker band
  const pts = [at(0.29, 0.02), at(0.34, 0.05), at(0.84, 0.054), at(0.866, 0.04), at(0.866, -0.04), at(0.84, -0.05), at(0.34, -0.046), at(0.29, -0.02)];
  const g = ctx.createLinearGradient(X(at(0.6, 0.05)), Y(at(0.6, 0.05)), X(at(0.6, -0.05)), Y(at(0.6, -0.05)));
  g.addColorStop(0, tone(C.bat, 0.25)); g.addColorStop(0.5, C.bat); g.addColorStop(1, C.batD);
  poly(pts, g);
  for (const w of [-0.02, 0.008, 0.03]) stroke(at(0.38, w), at(0.82, w + 0.004), 0.0025, 'rgba(150,110,50,0.35)');
  poly([at(0.4, 0.05), at(0.55, 0.052), at(0.55, -0.047), at(0.4, -0.046)], '#0b3d91', false);
  poly([at(0.43, 0.05), at(0.47, 0.051), at(0.47, -0.047), at(0.43, -0.046)], '#e8b83a', false);
  poly([at(0.29, 0.02), at(0.36, 0.0), at(0.29, -0.02)], tone(C.batD, -0.1), false); // splice
}
function torso(p) {
  const out = nrm(sub(p.shL, p.shR)), mid = lerp(p.hipL, p.hipR, 0.5);
  const hipA = add(p.hipL, { x: 0.03, y: 0.02 }), hipB = add(p.hipR, { x: -0.03, y: 0.02 });
  const shA = add(p.shL, mul(out, 0.055)), shB = add(p.shR, mul(out, -0.055));
  const waistA = lerp(shA, hipA, 0.6), waistB = lerp(shB, hipB, 0.6);
  ctx.beginPath(); ctx.moveTo(X(shA), Y(shA));
  ctx.quadraticCurveTo(X(add(waistA, mul(out, 0.03))), Y(add(waistA, mul(out, 0.03))), X(hipA), Y(hipA));
  ctx.lineTo(X(hipB), Y(hipB));
  ctx.quadraticCurveTo(X(add(waistB, mul(out, -0.03))), Y(add(waistB, mul(out, -0.03))), X(shB), Y(shB));
  ctx.quadraticCurveTo(X(p.neck), Y(add(p.neck, { x: 0, y: 0.05 })), X(shA), Y(shA));
  const g = ctx.createLinearGradient(X(shB), Y(shB), X(hipA), Y(hipA));
  g.addColorStop(0, tone(C.shirt, 0.18)); g.addColorStop(0.6, C.shirt); g.addColorStop(1, tone(C.shirt, -0.25));
  ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = OUT * S; ctx.strokeStyle = C.line; ctx.stroke();
  // collar and placket
  poly([add(p.neck, mul(out, -0.05)), add(p.neck, { x: 0, y: -0.07 }), add(p.neck, mul(out, 0.05))], tone(C.shirt, -0.4));
  stroke(add(p.neck, { x: 0, y: -0.07 }), lerp(p.neck, mid, 0.35), 0.004, tone(C.shirt, -0.3));
  // trousers round the hips
  taper(add(p.hipR, { x: 0.015, y: 0.0 }), add(p.hipL, { x: -0.015, y: 0.0 }), 0.07, 0.07, C.trou);
}
function head(p) {
  taper(p.neck, lerp(p.neck, p.head, 0.55), 0.045, 0.042, C.skin);
  const hd = p.head, r = 0.112;
  // face under the peak (looking down the pitch), ear guard, dome, peak, grille
  ell(add(hd, { x: 0.035, y: -0.03 }), 0.085, 0.095, 0, C.skin);
  ell(add(hd, { x: 0.105, y: -0.035 }), 0.016, 0.022, 0, tone(C.skin, -0.08)); // nose
  ctx.save(); ctx.translate(X(hd), Y(hd));
  const g = ctx.createRadialGradient(-r * 0.4 * S, -r * 0.5 * S, r * 0.1 * S, 0, 0, r * 1.2 * S);
  g.addColorStop(0, tone(C.helm, 0.35)); g.addColorStop(0.6, C.helm); g.addColorStop(1, tone(C.helm, -0.35));
  ctx.beginPath(); ctx.arc(0, 0, r * S, Math.PI * 0.92, Math.PI * 2.06); ctx.lineTo(-r * 0.15 * S, r * 0.62 * S); ctx.lineTo(-r * 0.92 * S, r * 0.55 * S); ctx.closePath();
  ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = OUT * S; ctx.strokeStyle = C.line; ctx.stroke();
  ctx.restore();
  ell(add(hd, { x: 0.1, y: 0.008 }), 0.058, 0.014, -0.08, tone(C.helm, -0.1)); // peak
  ctx.strokeStyle = C.grille; ctx.lineCap = 'round'; ctx.lineWidth = 0.009 * S;
  for (const y of [-0.035, -0.07, -0.105]) { ctx.beginPath(); ctx.moveTo(X(add(hd, { x: 0.03, y })), Y(add(hd, { x: 0.03, y }))); ctx.quadraticCurveTo(X(add(hd, { x: 0.15, y: y + 0.004 })), Y(add(hd, { x: 0.15, y: y + 0.004 })), X(add(hd, { x: 0.13, y: y - 0.02 })), Y(add(hd, { x: 0.13, y: y - 0.02 }))); ctx.stroke(); }
  stroke(add(hd, { x: 0.125, y: -0.01 }), add(hd, { x: 0.11, y: -0.12 }), 0.009, C.grille);
}
