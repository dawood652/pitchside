<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pitchside</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Pitchside" />
<meta name="theme-color" content="#0b100e" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" />
<style>
/* Layout: full-bleed 3D canvas, broadcast HUD overlay, menu as a floating panel over a live demo match.
   Deliberately single (dark broadcast) look in both themes. */
:root {
  --ink: #f3f5f2;
  --ink-dim: #a9b4ad;
  --panel: rgba(12, 18, 16, 0.86);
  --panel-solid: #0f1714;
  --line: rgba(255, 255, 255, 0.12);
  --accent: #ffe14d; /* marker yellow: matches the controlled-player ring */
  --pitch: #2f7a35;
  --danger: #ff5a4f;
  --font-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: #0b100e; color: var(--ink); font-family: var(--font-body); overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
#app, #app canvas { touch-action: none; }
button { touch-action: manipulation; }
#app { position: fixed; inset: 0; }
#app canvas { display: block; width: 100%; height: 100%; }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Score bug */
.bug { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: stretch; font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: 0.04em; box-shadow: 0 4px 18px rgba(0,0,0,.35); }
.bug > div { display: flex; align-items: center; padding: 4px 10px; }
.bug .team { background: #f3f5f2; color: #111; gap: 8px; }
.bug .chip { width: 6px; align-self: stretch; margin: -4px 0; }
.bug .score { background: #111; color: #fff; min-width: 64px; justify-content: center; font-variant-numeric: tabular-nums; font-size: 24px; }
.bug .clock { background: var(--accent); color: #111; font-variant-numeric: tabular-nums; min-width: 48px; justify-content: center; }
.half { position: fixed; top: calc(52px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); font: 600 12px var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); text-shadow: 0 1px 2px #000; }

.who { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .04em; text-shadow: 0 2px 6px rgba(0,0,0,.7); display: flex; gap: 10px; align-items: baseline; }
.who .num { color: var(--accent); font-size: 28px; }
.who .hint { font: 500 13px var(--font-body); color: var(--ink-dim); }

.power { position: fixed; width: 64px; height: 8px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.5); transform: translate(-50%, -100%); pointer-events: none; }
.power i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7ee081, var(--accent) 70%, var(--danger)); }

.banner { position: fixed; left: 50%; top: 34%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; }
.banner .big { font-family: var(--font-display); font-weight: 800; font-size: clamp(56px, 12vw, 132px); line-height: .9; letter-spacing: .02em; text-transform: uppercase; text-shadow: 0 6px 30px rgba(0,0,0,.5); }
.banner .small { margin-top: 8px; font: 600 clamp(16px, 2.4vw, 22px) var(--font-body); letter-spacing: .06em; text-transform: uppercase; background: rgba(0,0,0,.6); display: inline-block; padding: 6px 14px; }
.banner.pop .big { animation: pop .5s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { from { transform: scale(.6); opacity: 0 } to { transform: scale(1); opacity: 1 } }
.restart { position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); font: 700 16px var(--font-display); letter-spacing: .14em; text-transform: uppercase; background: rgba(0,0,0,.6); padding: 6px 14px; }

.replay { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; font: 800 22px var(--font-display); letter-spacing: .16em; text-transform: uppercase; background: rgba(0,0,0,.65); padding: 6px 16px; }
.replay i { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); animation: blink 1s steps(2) infinite; }
.replay span { font: 500 12px var(--font-body); letter-spacing: .04em; text-transform: none; color: var(--ink-dim); }
@keyframes blink { 50% { opacity: .2 } }
.tools { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; }
.tools button { background: rgba(0,0,0,.55); border: 1px solid var(--line); height: 36px; padding: 0 12px; font: 600 13px var(--font-body); letter-spacing: .04em; }

/* Menus */
.screen { position: fixed; inset: 0; display: flex; align-items: flex-start; justify-content: flex-start; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px; background: linear-gradient(90deg, rgba(5,9,7,.88) 0%, rgba(5,9,7,.6) 45%, rgba(5,9,7,0) 75%); overflow-y: auto; }
.menu { width: min(540px, 100%); display: grid; gap: 18px; margin-left: clamp(0px, 5vw, 64px); margin-block: auto; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: clamp(56px, 9vw, 96px); line-height: .85; letter-spacing: -.01em; text-transform: uppercase; }
.brand span { color: var(--accent); }
.tag { color: var(--ink-dim); font-size: 15px; max-width: 46ch; line-height: 1.45; margin-top: -6px; }
.matchup { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: stretch; }
.vs { align-self: center; font: 800 22px var(--font-display); color: var(--ink-dim); }
.card { background: var(--panel); border: 1px solid var(--line); padding: 12px; display: grid; gap: 8px; min-width: 0; }
.card .side { font: 600 11px var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); display: flex; justify-content: space-between; }
.card .side b { color: var(--accent); font-weight: 600; }
.card .name { font: 700 22px/1.05 var(--font-display); letter-spacing: .02em; text-transform: uppercase; min-height: 2.1em; text-wrap: balance; }
.card .row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.card .row button { width: 34px; height: 34px; background: transparent; border: 1px solid var(--line); font-size: 18px; line-height: 1; }
.card .row button:hover { border-color: var(--accent); }
.shirt { width: 56px; height: 48px; }
.ovr { font: 700 13px var(--font-body); color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.ovr strong { color: var(--ink); font-size: 18px; font-family: var(--font-display); }
.opts { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.opts label { font: 600 11px var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
.seg { display: inline-flex; border: 1px solid var(--line); }
.seg button { background: transparent; border: 0; padding: 8px 12px; font: 600 14px var(--font-body); color: var(--ink-dim); }
.seg button[aria-pressed="true"] { background: var(--ink); color: #111; }
.go { background: var(--accent); color: #111; border: 0; font: 800 26px var(--font-display); letter-spacing: .08em; text-transform: uppercase; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
.go:hover { filter: brightness(1.05); }
.keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 14px; font-size: 13px; color: var(--ink-dim); }
.keys div { display: flex; gap: 8px; align-items: center; }
kbd { font: 600 11px var(--font-body); background: #e9ece8; color: #111; padding: 2px 6px; border-bottom: 2px solid #9aa39d; min-width: 14px; text-align: center; }
.note { font-size: 12px; color: var(--ink-dim); }

.center { justify-content: center; background: rgba(5,9,7,.72); }
.final { margin: auto; width: min(460px, 100%); background: var(--panel-solid); border: 1px solid var(--line); padding: 22px; display: grid; gap: 16px; text-align: center; }
.final h2 { margin: 0; font: 600 13px var(--font-body); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim); }
.final .res { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; font: 700 22px var(--font-display); text-transform: uppercase; }
.final .res .n { font-size: 64px; font-variant-numeric: tabular-nums; }
.stats { display: grid; gap: 6px; font-size: 14px; }
.stats div { display: grid; grid-template-columns: 3ch 1fr 3ch; gap: 8px; font-variant-numeric: tabular-nums; }
.stats span:nth-child(2) { color: var(--ink-dim); }
.final .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.final .btns button { background: transparent; border: 1px solid var(--line); padding: 12px; font: 700 16px var(--font-display); letter-spacing: .06em; text-transform: uppercase; }
.final .btns button.primary { background: var(--accent); color: #111; border-color: var(--accent); }

/* Touch controls */
.touch { position: fixed; inset: 0; pointer-events: none; }
.stickzone { position: absolute; left: 0; top: 64px; bottom: 0; width: 42%; pointer-events: auto; touch-action: none; }
.stick { position: absolute; left: calc(max(24px, calc(env(safe-area-inset-left, 0px) + 8px)) + 66px); top: calc(100% - 84px - env(safe-area-inset-bottom, 0px)); width: 132px; height: 132px; margin: -66px 0 0 -66px; border-radius: 50%; background: rgba(255,255,255,.06); border: 1.5px solid rgba(255,255,255,.22); pointer-events: none; opacity: .55; transition: opacity .15s; }
.stick.live { opacity: 1; transition: none; }
.touch .def { display: none; }
.touch.defending .att { display: none; }
.touch.defending .def { display: inline; }
.touch.defending [data-a="through"], .touch.defending [data-a="lob"], .touch.defending [data-a="finesse"] { opacity: .25; }
.stick i { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px; border-radius: 50%; background: rgba(255,255,255,.4); }
.pad { position: absolute; right: max(18px, calc(env(safe-area-inset-right, 0px) + 6px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: 220px; height: 176px; pointer-events: none; }
.pad button { position: absolute; border-radius: 50%; background: rgba(0,0,0,.32); border: 1.5px solid rgba(255,255,255,.35); font: 700 10.5px var(--font-display); letter-spacing: .02em; padding: 0; touch-action: none; pointer-events: auto; color: #fff; }
.pad button.main { background: rgba(255,225,77,.78); color: #111; font-size: 14px; }
.pad button.on { background: rgba(255,255,255,.85); color: #111; }
.pad [data-a="shoot"] { width: 76px; height: 76px; right: 0; bottom: 34px; }
.pad [data-a="pass"] { width: 68px; height: 68px; right: 84px; bottom: 0; }
.pad [data-a="through"] { width: 54px; height: 54px; right: 92px; bottom: 76px; }
.pad [data-a="lob"] { width: 54px; height: 54px; right: 4px; bottom: 118px; }
.pad [data-a="finesse"] { width: 50px; height: 50px; right: 156px; bottom: 56px; }
.pad [data-a="sprint"] { width: 54px; height: 54px; right: 162px; bottom: 0; }
.pad [data-a="switch"] { width: 50px; height: 50px; right: 62px; bottom: 126px; }
.rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px; background: #0b100e; z-index: 50; text-align: center; padding-inline: 24px; }
.rotate b { font: 800 30px var(--font-display); letter-spacing: .04em; text-transform: uppercase; }
.rotate span { color: var(--ink-dim); font-size: 15px; max-width: 30ch; }
.rotate svg { width: 84px; height: 84px; animation: tilt 2.2s ease-in-out infinite; }
@keyframes tilt { 0%, 30% { transform: rotate(0) } 60%, 100% { transform: rotate(-90deg) } }
/* Phone held upright but the page can't rotate (e.g. inside an app): draw the match sideways */
body.force-landscape #app, body.force-landscape #ui { position: fixed; top: 0; left: 100vw; width: 100vh; height: 100vw; transform-origin: left top; transform: rotate(90deg); overflow: hidden; }
body.force-landscape #ui { pointer-events: none; }
body.force-landscape #ui > * { pointer-events: auto; }
body.force-landscape #ui > .touch { pointer-events: none; }
@media (max-height: 520px) {
  .screen { padding-block: 10px; }
  .menu { gap: 10px; width: min(620px, 100%); }
  .brand { font-size: 44px; }
  .tag { display: none; }
  .matchup { grid-template-columns: 1fr auto 1fr; }
  .card { padding: 8px; gap: 4px; }
  .card .name { font-size: 17px; min-height: 0; }
  .shirt { width: 40px; height: 34px; }
  .go { font-size: 22px; padding: 10px 16px; }
  .seg button { padding: 6px 10px; font-size: 13px; }
  .bug { font-size: 17px; }
  .bug .score { font-size: 18px; min-width: 48px; }
  .banner .big { font-size: 64px; }
}
@media (pointer: coarse) { .half { display: none; } .keys { display: none; } .replay span::before { content: 'Tap to skip'; } .replay span { font-size: 0; } .replay span::before { font-size: 12px; } }

@media (max-width: 640px) {
  .screen { align-items: flex-start; background: rgba(5,9,7,.82); }
  .menu { margin-left: 0; }
  .vs { justify-self: center; }
  .bug { font-size: 17px; }
  .bug .score { font-size: 18px; min-width: 48px; }
}
@media (max-width: 640px) {
  .tools { top: calc(54px + env(safe-area-inset-top, 0px)); }
  .tools button { height: 30px; padding: 0 10px; font-size: 12px; }
  .half { display: none; }
}
@media (pointer: coarse) {
  .who { bottom: auto; top: calc(52px + env(safe-area-inset-top, 0px)); font-size: 16px; }
  .who .num { font-size: 20px; }
  .who .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .banner.pop .big { animation: none; } }

.tools { right: calc(max(16px, env(safe-area-inset-right, 0px)) + 46px); }
.gear { position: fixed; z-index: 6; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: 38px; height: 36px; padding: 0; background: rgba(0,0,0,.55); border: 1px solid var(--line); font-size: 18px; line-height: 1; }
.fps { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(8px + env(safe-area-inset-bottom, 0px)); font: 600 11px/1 ui-monospace, monospace; color: #cfe8c8; background: rgba(0,0,0,.5); padding: 4px 6px; border-radius: 4px; pointer-events: none; z-index: 6; }
.settings { width: min(560px, 94vw); max-height: 88vh; overflow-y: auto; text-align: left; z-index: 7; }
.settings h2 { text-align: center; }
.set-row { display: grid; grid-template-columns: 9.5em 1fr; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid rgba(255,255,255,.08); }
.set-row label { font: 600 13px var(--font-body); letter-spacing: .03em; opacity: .9; }
.set-row input[type=range] { width: 100%; accent-color: #ffe14d; }
.seg-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
.seg-wrap button { flex: 0 0 auto; min-height: 34px; padding: 0 10px; font-size: 13px; }
body.settings-open .touch, body.settings-open .gear, body.settings-open .tools { display: none; }
.settings { z-index: 20; }
@media (max-height: 520px) {
  .settings { padding: 12px 16px !important; }
  .set-row { padding: 3px 0; grid-template-columns: 8em 1fr; }
  .set-row label { font-size: 12px; }
  .seg-wrap button { min-height: 28px; padding: 0 8px; font-size: 12px; }
  .settings h2 { margin: 0 0 4px; font-size: 14px; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="ui"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
